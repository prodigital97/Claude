<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="256" y1="134" x2="256" y2="390">
      <stop offset="0" stop-color="#e4ff4f"/>
      <stop offset="1" stop-color="#b4ee00"/>
    </linearGradient>
    <radialGradient id="bloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c8ff00" stop-opacity=".20"/>
      <stop offset=".6" stop-color="#c8ff00" stop-opacity=".06"/>
      <stop offset="1" stop-color="#c8ff00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- full-bleed background: Android crops this to whatever shape it likes -->
  <rect width="512" height="512" fill="#0a0b0e"/>
  <circle cx="256" cy="258" r="170" fill="url(#bloom)"/>

  <!-- mark scaled into the ~70% maskable safe zone so no crop clips it -->
  <g transform="translate(256 256) scale(0.72) translate(-256 -256)"
     fill="none" stroke="url(#neon)" stroke-width="46"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M152 390 L256 134 L360 390"/>
    <path d="M198 308 H314"/>
  </g>
</svg>
