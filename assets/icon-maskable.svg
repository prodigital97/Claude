      <circle cx="256" cy="256" r="196" stroke="#38bdf8" stroke-dasharray="88 480" stroke-dashoffset="-381" transform="rotate(-90 256 256)"/>
    </g>
    <text x="256" y="322" text-anchor="middle" font-family="'Space Grotesk', Arial, Helvetica, sans-serif"
