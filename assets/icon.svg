<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="neon" gradientUnits="userSpaceOnUse" x1="256" y1="134" x2="256" y2="390">
      <stop offset="0" stop-color="#e4ff4f"/>
      <stop offset="1" stop-color="#b4ee00"/>
    </linearGradient>
    <!-- A real soft halo. Layered wide strokes read as a dirty outline, and
         feGaussianBlur gets dropped by some icon rasterisers — a radial fade
         behind the mark survives both. -->
    <radialGradient id="bloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c8ff00" stop-opacity=".20"/>
      <stop offset=".6" stop-color="#c8ff00" stop-opacity=".06"/>
      <stop offset="1" stop-color="#c8ff00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="512" height="512" rx="116"/></clipPath>
  </defs>

  <g clip-path="url(#r)">
    <rect width="512" height="512" fill="#0a0b0e"/>
    <circle cx="256" cy="262" r="215" fill="url(#bloom)"/>
    <g fill="none" stroke="url(#neon)" stroke-width="46"
       stroke-linecap="round" stroke-linejoin="round">
      <path d="M152 390 L256 134 L360 390"/>
      <path d="M198 308 H314"/>
    </g>
  </g>
</svg>
